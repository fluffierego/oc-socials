<!doctype html><html><head><title>{{chat['name']}}</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><b>{{chat['name']}}</b><span><a href="/messages">← Chats</a></span></nav><main><section class="card"><h2>Members</h2><div class="members">{% for m in members %}<span><img src="{{m['avatar']}}">{{m['name']}}</span>{% endfor %}</div></section><section class="messages">{% for m in messages %}<div class="message {% if m['owner_id']==user['id'] %}mine{% endif %}"><img src="{{m['avatar']}}"><div><b>{{m['name']}}</b><p>{{m['text']}}</p></div></div>{% else %}<p>No messages yet.</p>{% endfor %}</section><section class="card"><form id="message-form"><input type="hidden" id="chat-id" value="{{chat['id']}}"><select id="oc-id" required>{% for oc in mine %}<option value="{{oc['id']}}">{{oc['name']}}</option>{% endfor %}</select><input id="message-text" placeholder="Message..." required><button>Send as OC</button></form><small>Choose which of your OCs sends each message.</small></section></main><script src="/static/app.js"></script></body></html>
