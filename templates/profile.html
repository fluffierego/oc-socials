<!doctype html><html><head><title>{{oc['name']}}</title><link rel="stylesheet" href="/static/style.css"></head><body><nav><b>OC Socials</b><span><a href="/">Home</a><a href="/instagram">Instagram</a><a href="/twitter">Twitter/X</a><a href="/messages">iMessage</a></span></nav><main class="profile"><div class="banner" {% if oc['banner'] %}style="background-image:url('{{oc['banner']}}')"{% endif %}></div><img class="profile-avatar" src="{{oc['avatar']}}" onerror="this.style.display='none'"><div class="profile-body"><div class="profile-head"><div><h1>{{oc['name']}}</h1><h3>@{{oc['username']}}</h3></div>{% if user['id']==oc['owner_id'] %}<a class="btn secondary" href="/oc/{{oc['id']}}/edit">Edit profile</a>{% endif %}</div><p>{{oc['bio']}}</p></div><div class="profile-posts">{% for p in posts %}<article class="post">{% if p['image'] %}<img class="photo" src="{{p['image']}}">{% endif %}<p>{{p['text']}}</p><small>{{p['platform']}}</small></article>{% else %}<p>No posts yet.</p>{% endfor %}</div></main></body></html>
