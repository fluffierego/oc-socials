<!doctype html><html><head><title>Edit {{oc['name']}}</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card narrow"><h1>Edit @{{oc['username']}}</h1>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>Name</label><input name="name" value="{{oc['name']}}" required><label>Username</label><input name="username" value="@{{oc['username']}}" required><label>Bio</label><textarea name="bio">{{oc['bio']}}</textarea><label>Avatar URL</label><input name="avatar" value="{{oc['avatar']}}"><label>Banner URL</label><input name="banner" value="{{oc['banner']}}"><button>Save changes</button></form><p><a href="/oc/{{oc['id']}}">← Back to profile</a></p></main></body></html>
