<!doctype html><html><head><title>New iMessage group</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card narrow"><h1>New iMessage group chat</h1><p>Choose the OCs you want to control in this chat. Other people can later add their own OCs when you give them access through the app.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><input name="name" placeholder="the aussie gc" required><h3>Your OCs</h3>{% for oc in ocs %}<label class="check"><input type="checkbox" name="oc_ids" value="{{oc['id']}}"> {{oc['name']}} (@{{oc['username']}})</label>{% else %}<p>You need an OC first.</p>{% endfor %}<button>Create group chat</button></form><p><a href="/messages">← Back</a></p></main></body></html>
