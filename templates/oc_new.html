<!doctype html><html><head><title>Create OC</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="card narrow"><h1>Create your OC</h1><p>This is the profile your character uses on Instagram, Twitter/X and iMessage.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>Name</label><input name="name" required placeholder="Henry"><label>Username</label><input name="username" required placeholder="@henry"><label>Bio</label><textarea name="bio" placeholder="Character bio"></textarea><label>Avatar URL</label><input name="avatar" placeholder="https://..."><label>Banner URL</label><input name="banner" placeholder="https://..."><button>Create OC</button></form><p><a href="/">← Back</a></p></main></body></html>
