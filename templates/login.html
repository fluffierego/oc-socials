<!doctype html>
<html>
<head>
    <title>OC Socials Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="card narrow">
<h1>OC Socials</h1>
<p>Enter the login code from the OC Socials bot on Discord.</p>
<form action="/social-login/verify" method="POST">
<label for="code">Login code</label>
<input id="code" name="code" placeholder="6Character code" minlength="6" maxlength="6" autocomplete="off" required>
<br><br>
<button class="btn" type="submit">Log in</button>
</form>
<p class="error">{{ error | default('') }}</p>
<p>You will get a code with  <code>!sociallogin</code>  in Discord.</p>
</main>
</body>
</html>
